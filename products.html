<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Showcase</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Product Showcase</h1>
    </header>

    <main class="product-container">
      <div class="product-card">
        <img src="JBL.jpg" alt="Product 1" />
        <h2>Wireless Headphones</h2>
        <p class="price">R899.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="samsung watch.jpg" alt="Product 2" />
        <h2>Smart Watch</h2>
        <p class="price">R1,299.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="JBL speaker.jpg" alt="Product 3" />
        <h2>Bluetooth Speaker</h2>
        <p class="price">R599.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="razer mouse.jpg" alt="Product 4" />
        <h2>Gaming Mouse</h2>
        <p class="price">R349.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="keyboard.jpg" alt="Product 5" />
        <h2>Mechanical Keyboard</h2>
        <p class="price">R799.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="logi.jpg" alt="Product 6" />
        <h2>Webcam HD</h2>
        <p class="price">R499.99</p>
        <button>Add to Cart</button>
      </div>
    </main>
  </body>
</html>
